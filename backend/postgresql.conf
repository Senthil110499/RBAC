# PostgreSQL Configuration File

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Authentication
password_encryption = scram-sha-256

# Memory
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'none'

# Other
timezone = 'UTC'
